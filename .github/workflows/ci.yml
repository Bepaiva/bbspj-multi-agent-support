name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests evals
      - name: Unit + integration tests (offline, fake LLM)
        run: pytest
      - name: Evaluation smoke run (fake LLM, quality gate)
        run: python -m evals.run_evals --fake

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t getnet-multi-agent-support:ci .
      - name: Boot and check health
        run: |
          docker run -d --name api -p 8000:8000 -e OPENAI_API_KEY= -e INGEST_ON_STARTUP=false getnet-multi-agent-support:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
